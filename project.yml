name: ImprovedRightClick
options:
  bundleIdPrefix: com.improvedrightclick
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: NK36NGGB2V
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

targets:

  ImprovedRightClick:
    type: application
    platform: macOS
    sources:
      - path: ImprovedRightClick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.improvedrightclick.app
        INFOPLIST_FILE: ImprovedRightClick/Info.plist
        CODE_SIGN_ENTITLEMENTS: ImprovedRightClick/ImprovedRightClick.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: FinderSyncExtension
        embed: true

  FinderSyncExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSyncExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.improvedrightclick.app.FinderSyncExtension
        INFOPLIST_FILE: FinderSyncExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderSyncExtension/FinderSyncExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
